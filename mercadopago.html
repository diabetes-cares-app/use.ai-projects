<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio — Mercado Pago</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #dfe3e8; color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px 12px 60px;
  }
  .wrap { max-width: 420px; margin: 0 auto; }
  .panel {
    background: #fff; border-radius: 14px; padding: 18px 16px 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08); margin-bottom: 20px;
  }
  .panel h2 { margin: 0 0 16px; font-size: 16px; font-weight: 700; text-align: center; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }
  .field label {
    font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
    color: #6b7280; font-weight: 600;
  }
  .field input {
    width: 100%; padding: 10px 11px; border: 1px solid #d3d7dd; border-radius: 9px;
    font-size: 14px; font-family: inherit; color: #111; background: #fbfcfd;
  }
  .field input:focus {
    outline: none; border-color: #2f6bff; background: #fff;
    box-shadow: 0 0 0 3px rgba(47,107,255,.12);
  }
  .field input.big { font-size: 20px; font-weight: 700; }
  .preview-btn {
    width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 10px;
    background: #ffe000; color: #1a1a1a; font-size: 15px; font-weight: 800;
    font-family: inherit; cursor: pointer;
  }
  .preview-btn:active { background: #e8cc00; }
  .hint { font-size: 11.5px; color: #7a828d; margin: 10px 0 0; line-height: 1.45; }

  /* ---------- PHONE ---------- */
  .phone {
    background: #fff; border-radius: 26px; overflow: hidden;
    box-shadow: 0 6px 22px rgba(0,0,0,.18);
    display: flex; flex-direction: column; height: 780px;
    position: relative;
  }

  .hero { background: #ffe000; flex: 0 0 auto; padding-bottom: 0; position: relative; }

  .topbar { display: flex; align-items: flex-start; gap: 10px; padding: 20px 16px 0; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; background: #0e93e0; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .avatar svg { width: 27px; height: 27px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; }
  .hello { flex: 1; min-width: 0; }
  .hello h1 { margin: 0; font-size: 21px; font-weight: 800; color: #1a1a1a; line-height: 1.2; }
  .meli {
    display: inline-block; background: #ff2f8e; color: #fff; font-size: 12px;
    font-weight: 700; padding: 3px 10px; border-radius: 5px; margin-top: 6px;
  }
  .hb {
    width: 44px; height: 44px; border-radius: 12px; background: rgba(214,190,0,.30);
    display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
    position: relative; border: 0; cursor: pointer;
  }
  .hb svg { width: 23px; height: 23px; stroke: #1a1a1a; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .hb .badge {
    position: absolute; right: -3px; top: -4px; min-width: 19px; height: 19px;
    border-radius: 10px; background: #ff1f1f; color: #fff; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; padding: 0 4px;
  }

  .tabs {
    display: flex; align-items: flex-end; gap: 4px; padding: 18px 0 0 14px;
    position: relative;
  }
  .tab {
    border: 0; background: transparent; font-family: inherit; font-size: 17px;
    color: #6d6636; cursor: pointer; padding: 10px 16px; border-radius: 16px 16px 0 0;
    white-space: nowrap;
  }
  .tab.on { background: #fff; color: #1a1a1a; font-weight: 800; }

  .sheet { background: #fff; border-radius: 0 20px 0 0; padding: 18px 18px 20px; position: relative; }
  .sheet.top-round { border-radius: 20px 20px 0 0; }

  .balance-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .balance {
    display: inline-flex; align-items: flex-start; font-weight: 700; color: #1a1a1a;
    letter-spacing: -.5px; line-height: 1;
  }
  .balance .cur { font-size: 34px; }
  .balance .num { font-size: 40px; }
  .balance .dec { font-size: 21px; transform: translateY(-9px); }
  .balanceicons { display: flex; align-items: center; gap: 14px; padding-top: 6px; }
  .balanceicons svg { width: 23px; height: 23px; stroke: #1a1a1a; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .balanceicons .chev { color: #2f6bff; font-size: 22px; font-weight: 700; }

  .yield { font-size: 15.5px; margin: 12px 0 18px; color: #1a1a1a; }
  .yield b { color: #12a150; font-weight: 700; }

  .chiprow { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .chip {
    background: #eef2ff; color: #2b3ce0; border: 0; border-radius: 18px;
    padding: 17px 8px; font-family: inherit; font-size: 16px; font-weight: 700;
    cursor: pointer; text-align: center;
  }

  .below { background: #fff; flex: 1 1 auto; overflow-y: auto; padding: 6px 16px 0; }
  .below::-webkit-scrollbar { width: 0; }
  .secrow { font-size: 25px; font-weight: 800; color: #1a1a1a; margin: 18px 0 16px; }

  .tools { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
  .tool {
    background: #eef2ff; border-radius: 16px; padding: 18px 6px 16px; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    min-height: 118px;
  }
  .tool svg { width: 30px; height: 30px; stroke: #2b3ce0; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tool .lbl {
    color: #2b3ce0; font-size: 14.5px; font-weight: 700; line-height: 1.2;
  }
  .tool .lbl span { display: block; }
  .tool .rot { transform: rotate(45deg); }

  .cards-row {
    display: flex; align-items: center; justify-content: space-between;
    border: 1.5px solid #d8d8d8; border-radius: 22px; padding: 16px 18px;
    margin: 20px 0 8px; cursor: pointer;
  }
  .cards-row span { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; color: #1a1a1a; }
  .cards-row svg { width: 26px; height: 26px; stroke: #1a1a1a; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .cards-row .chev { color: #1a1a1a; font-size: 22px; font-weight: 700; }

  .homebar { height: 26px; display: flex; align-items: center; justify-content: center; background: #fff; flex: 0 0 auto; }
  .homebar i { width: 118px; height: 5px; border-radius: 3px; background: #1a1a1a; display: block; }
</style>
</head>
<body>
<div class="wrap">

  <div class="panel">
    <h2>Datos de la pantalla</h2>
    <div class="grid">
      <div class="field full">
        <label for="usuario">Saludo</label>
        <input id="usuario" value="Huellas unidas">
      </div>
      <div class="field">
        <label for="saldoEnt">Saldo</label>
        <input id="saldoEnt" class="big" value="218.255">
      </div>
      <div class="field">
        <label for="saldoDec">Decimales</label>
        <input id="saldoDec" value="59">
      </div>
      <div class="field full">
        <label for="rendimiento">Rendimiento 12 meses</label>
        <input id="rendimiento" value="$ 13.752,77">
      </div>
      <div class="field">
        <label for="notif">Notificaciones</label>
        <input id="notif" value="11">
      </div>
      <div class="field">
        <label for="tabActiva">Pestaña activa</label>
        <input id="tabActiva" value="Pesos">
      </div>
    </div>
    <p class="hint">Podés cambiar la pestaña activa tocándola directamente en la vista previa.</p>
    <button type="button" class="preview-btn" id="previewBtn">Ver vista previa</button>
  </div>

  <div class="phone" id="phone">

    <div class="hero">
      <div class="topbar">
        <div class="avatar">
          <svg viewBox="0 0 24 24"><path d="M8 12a4 4 0 0 1 4-4h2a4 4 0 0 1 0 8h-2"/><path d="M16 12a4 4 0 0 1-4 4h-2a4 4 0 0 1 0-8h2"/></svg>
        </div>
        <div class="hello">
          <h1>Hola, <span id="pUsuario">Huellas unidas</span></h1>
          <span class="meli">meli+</span>
        </div>
        <button type="button" class="hb">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
        </button>
        <button type="button" class="hb">
          <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="badge" id="pNotif">11</span>
        </button>
      </div>

      <div class="tabs" id="tabs">
        <button type="button" class="tab on">Pesos</button>
        <button type="button" class="tab">Dólares</button>
        <button type="button" class="tab">Reservas</button>
        <button type="button" class="tab">Inversiones</button>
      </div>

      <div class="sheet top-round">
        <div class="balance-row">
          <div class="balance">
            <span class="cur">$</span>
            <span class="num" id="pSaldo">218.255</span>
            <span class="dec" id="pDec">59</span>
          </div>
          <div class="balanceicons">
            <svg viewBox="0 0 24 24"><path d="M1.5 12S5.5 5.5 12 5.5 22.5 12 22.5 12 18.5 18.5 12 18.5 1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <span class="chev">&#8250;</span>
          </div>
        </div>
        <p class="yield">Los últimos 12 meses rindió <b id="pRend">$ 13.752,77</b></p>
        <div class="chiprow">
          <button type="button" class="chip">Ingresar</button>
          <button type="button" class="chip">Transferir</button>
          <button type="button" class="chip">Tus alias</button>
        </div>
      </div>
    </div>

    <div class="below">
      <div class="secrow">Herramientas de cobro</div>
      <div class="tools">
        <div class="tool">
          <svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M9 7h6M9 10.5h6M9 14h6"/><rect x="2" y="9" width="3" height="6" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/></svg>
          <div class="lbl">Point</div>
        </div>
        <div class="tool">
          <svg viewBox="0 0 24 24"><path d="M9.5 14.5l5-5"/><path d="M8 12l-2.5 2.5a3.5 3.5 0 0 0 5 5L13 17"/><path d="M16 12l2.5-2.5a3.5 3.5 0 0 0-5-5L11 7"/></svg>
          <div class="lbl"><span>Link de</span><span>pago</span></div>
        </div>
        <div class="tool">
          <svg viewBox="0 0 24 24"><path d="M3 8V4.5h4M21 8V4.5h-4M3 16v3.5h4M21 16v3.5h-4"/><rect x="8" y="8" width="3" height="3"/><rect x="13" y="8" width="3" height="3"/><rect x="8" y="13" width="3" height="3"/><path d="M14.5 14.5h1.5v1.5h-1.5z"/></svg>
          <div class="lbl">QR</div>
        </div>
        <div class="tool">
          <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M4 9h16M4 15h16M12 3v18"/><path d="M7.5 6h.01M16.5 6h.01M7.5 12h.01M16.5 18h.01"/></svg>
          <div class="lbl"><span>Simulador</span><span>de costos</span></div>
        </div>
        <div class="tool">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M9 12h6"/></svg>
          <div class="lbl"><span>Cotización</span><span>y cambio</span></div>
        </div>
      </div>

      <div class="cards-row">
        <span>
          <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M2.5 10.5h19"/><path d="M6 15h3"/></svg>
          Tarjetas
        </span>
        <span class="chev">&#8250;</span>
      </div>
    </div>

    <div class="homebar"><i></i></div>
  </div>

</div>

<script>
  var map = { usuario:'pUsuario', saldoEnt:'pSaldo', saldoDec:'pDec',
              rendimiento:'pRend', notif:'pNotif' };
  var phone = document.getElementById('phone');

  function render() {
    for (var id in map) {
      var v = document.getElementById(id).value.trim();
      document.getElementById(map[id]).textContent = v || '—';
    }
  }
  document.getElementById('previewBtn').addEventListener('click', function () {
    render();
    phone.scrollIntoView({ behavior:'smooth', block:'start' });
  });
  document.querySelectorAll('.panel input').forEach(function (el) {
    el.addEventListener('input', render);
  });

  // interactive tabs
  document.querySelectorAll('#tabs .tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('#tabs .tab').forEach(function (x) { x.classList.remove('on'); });
      t.classList.add('on');
      document.getElementById('tabActiva').value = t.textContent.trim();
    });
  });

  render();
</script>
</body>
</html>
